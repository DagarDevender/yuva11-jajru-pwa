<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174238"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yuva 11 Fund">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Yuva 11 Jajru – Team Fund Manager</title>
<style>
:root{--green:#174238;--green2:#217b55;--gold:#e5b65b;--bg:#f1f5f2;--muted:#77877f;--red:#c94d4d;--line:#e0e9e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20372f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{background:linear-gradient(135deg,#123b32,#245c4d);color:white;padding:44px 20px 25px;border-radius:0 0 22px 22px}
.brand{font-size:25px;font-weight:900;letter-spacing:1px}.sub{color:var(--gold);font-weight:800;letter-spacing:4px;font-size:12px;margin-top:5px}
main{padding:16px;max-width:760px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:19px;margin:12px 0;box-shadow:0 5px 20px #173e3010}
.kicker{font-size:12px;letter-spacing:2px;color:var(--muted);font-weight:800;text-transform:uppercase}.big{font-size:38px;font-weight:900;margin:9px 0}.green{color:var(--green2)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{font-size:26px;font-weight:850;margin-top:8px}.section-title{font-size:21px;font-weight:850;margin:5px 0 15px}
button,.btn{border:0;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:750;background:#e8f0eb;color:var(--green);cursor:pointer}
.primary{background:var(--green);color:white}.danger{background:#fff0ef;color:var(--red)}.gold{background:#fff5df;color:#7b5819}.small{padding:8px 10px;font-size:13px;border-radius:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.muted{color:var(--muted);font-size:13px}.amount{font-weight:850;font-size:17px}.empty{color:var(--muted);padding:18px 0;text-align:center}
input,select,textarea{width:100%;padding:13px;border:1px solid #d8e3dc;border-radius:12px;background:white;font:inherit;color:#20372f;margin:6px 0 13px}
label{font-size:13px;font-weight:750;color:#52665c}form .actions{margin-top:5px}.hidden{display:none!important}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{background:transparent;padding:8px 5px;font-size:11px;color:var(--muted);flex:1}nav button.active{background:#e8f0eb;color:var(--green)}
.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#e7f4eb;color:#217b55;font-weight:800}.pill.pending{background:#fff2df;color:#94651a}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
</style></head>
<body>
<header><div class="brand">🏏 YUVA 11 JAJRU</div><div class="sub">TEAM FUND MANAGER</div></header>
<main id="app"></main>
<nav id="nav">
<button data-tab="home" class="active">⌂<br>Home</button><button data-tab="players">♙<br>Players</button><button data-tab="monthly">₹<br>Monthly</button><button data-tab="ledger">▤<br>Ledger</button><button data-tab="reports">▦<br>Reports</button>
</nav>
<script>
const KEY='yuva11_fund_v2';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{players:[],entries:[],opening:0};
let tab='home', editId=null;
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const total=(type)=>db.entries.filter(x=>x.type===type).reduce((a,x)=>a+Number(x.amount),0);
const balance=()=>Number(db.opening||0)+total('in')-total('out');
const playerName=id=>db.players.find(p=>p.id===id)?.name||'Deleted player';
const monthNow=()=>new Date().toISOString().slice(0,7);
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function card(title,content){return `<section class="card">${title?`<div class="section-title">${title}</div>`:''}${content}</section>`}
function playerTotals(id,month){return db.entries.filter(e=>e.type==='in'&&e.playerId===id&&(!month||e.month===month)).reduce((a,e)=>a+Number(e.amount),0)}
function render(){
let out='';
if(tab==='home'){
out=card('AVAILABLE TEAM FUND',`<div class="big">${money(balance())}</div><div class="muted">Opening balance + contributions − expenses</div>`)
+`<div class="grid">${card('TOTAL CONTRIBUTIONS',`<div class="metric green">${money(total('in'))}</div>`)}${card('TOTAL EXPENSES',`<div class="metric red">${money(total('out'))}</div>`)}${card('PLAYERS',`<div class="metric">${db.players.filter(p=>!p.archived).length} / 20</div>`)}${card('ENTRIES',`<div class="metric">${db.entries.length}</div>`)}</div>`
+card('Quick actions',`<div class="actions"><button class="primary" onclick="showEntry('in')">+ Add contribution</button><button onclick="setTab('players')">Manage players</button><button onclick="setTab('monthly')">Monthly dashboard</button><button onclick="showEntry('out')">Add expense</button></div>`)
+card('Recent transactions',listEntries(db.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5)));
}else if(tab==='players'){
out=card('Players',`<div class="row"><span class="muted">${db.players.filter(p=>!p.archived).length} active players</span><button class="primary small" onclick="playerForm()">+ Add player</button></div>${db.players.filter(p=>!p.archived).map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.phone||'No phone')} · Contributions ${money(playerTotals(p.id))}</div></div><div class="actions"><button class="small" onclick="playerForm('${p.id}')">Edit</button><button class="small danger" onclick="removePlayer('${p.id}')">Delete</button></div></div></div>`).join('')||'<div class="empty">No players yet. Add your first player.</div>'}`);
}else if(tab==='monthly'){
let m=window.selectedMonth||monthNow(), active=db.players.filter(p=>!p.archived);
out=card('Monthly player dashboard',`<label>Select month</label><input type="month" value="${m}" onchange="window.selectedMonth=this.value;render()"> <div class="grid"><div><div class="kicker">Received this month</div><div class="metric green">${money(db.entries.filter(e=>e.type==='in'&&e.month===m).reduce((a,e)=>a+ +e.amount,0))}</div></div><div><div class="kicker">Players contributed</div><div class="metric">${active.filter(p=>playerTotals(p.id,m)>0).length}/${active.length}</div></div></div><hr>${active.map(p=>{let amt=playerTotals(p.id,m);return `<div class="item"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${amt?`Received ${money(amt)}`:'No contribution recorded'}</div></div><div class="actions"><span class="pill ${amt?'':'pending'}">${amt?'Received':'Pending'}</span><button class="small primary" onclick="showEntry('in','${p.id}','${m}')">+ Add</button></div></div></div>`}).join('')||'<div class="empty">Add players first to start monthly tracking.</div>'}<p class="muted">You can record any amount for each player. Multiple contributions in a month are allowed.</p>`);
}else if(tab==='ledger'){
out=card('Ledger',`<div class="actions"><button class="primary" onclick="showEntry('in')">+ Contribution</button><button class="gold" onclick="showEntry('out')">− Expense</button></div>${listEntries(db.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)))}`);
}else if(tab==='reports'){
let m=window.selectedMonth||monthNow(), inc=db.entries.filter(e=>e.type==='in'&&e.month===m).reduce((a,e)=>a+ +e.amount,0), exp=db.entries.filter(e=>e.type==='out'&&e.date.slice(0,7)===m).reduce((a,e)=>a+ +e.amount,0);
out=card('Monthly report',`<label>Month</label><input type="month" value="${m}" onchange="window.selectedMonth=this.value;render()"><div class="grid"><div><div class="kicker">Contributions</div><div class="metric green">${money(inc)}</div></div><div><div class="kicker">Expenses</div><div class="metric red">${money(exp)}</div></div></div><hr><div class="kicker">Net movement</div><div class="big">${money(inc-exp)}</div><button class="primary" onclick="exportCSV()">Export ledger to CSV (Excel)</button><button onclick="backup()">Backup data</button><label class="btn">Restore backup<input type="file" accept="application/json" onchange="restore(event)" hidden></label>`);
}
$('#app').innerHTML=out;
}
function listEntries(items){return items.map(e=>`<div class="item"><div class="row"><div><b>${e.type==='in'?'Contribution':'Expense'}${e.playerId?' · '+esc(playerName(e.playerId)):''}</b><div class="muted">${esc(e.date)}${e.month?' · '+esc(e.month):''}${e.note?' · '+esc(e.note):''}</div></div><div class="amount ${e.type==='in'?'green':'red'}">${e.type==='in'?'+':'−'}${money(e.amount)}</div></div></div>`).join('')||'<div class="empty">No transactions recorded yet.</div>'}
function playerForm(id){
let p=db.players.find(x=>x.id===id)||{name:'',phone:''};
$('#app').innerHTML=card(id?'Edit player':'Add new player',`<form onsubmit="savePlayer(event,'${id||''}')"><label>Player name *</label><input name="name" required maxlength="50" value="${esc(p.name)}" placeholder="Enter player name"><label>Phone (optional)</label><input name="phone" inputmode="tel" value="${esc(p.phone||'')}" placeholder="Phone number"><div class="actions"><button class="primary">Save player</button><button type="button" onclick="setTab('players')">Cancel</button></div></form>`);
}
function savePlayer(ev,id){ev.preventDefault();let f=new FormData(ev.target),name=f.get('name').trim();if(!name)return;
if(id){let p=db.players.find(x=>x.id===id);p.name=name;p.phone=f.get('phone').trim()}else{if(db.players.filter(p=>!p.archived).length>=20){alert('Maximum 20 active players.');return}db.players.push({id:crypto.randomUUID(),name,phone:f.get('phone').trim(),archived:false})}
save();setTab('players')}
function removePlayer(id){if(!confirm('Delete this player from the active list? Their previous transactions will be retained in the ledger.'))return;let p=db.players.find(x=>x.id===id);p.archived=true;save();render()}
function showEntry(type,playerId='',month=''){
let date=new Date().toISOString().slice(0,10), players=db.players.filter(p=>!p.archived);
$('#app').innerHTML=card(type==='in'?'Add contribution':'Add expense',`<form onsubmit="saveEntry(event,'${type}')">${type==='in'?`<label>Player *</label><select name="playerId" required><option value="">Select player</option>${players.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}<label>Amount (₹) *</label><input name="amount" type="number" min="1" step="0.01" required placeholder="Enter amount"><label>Date *</label><input name="date" type="date" required value="${date}">${type==='in'?`<label>Contribution month</label><input name="month" type="month" value="${month||date.slice(0,7)}">`:''}<label>Note (optional)</label><input name="note" maxlength="100" placeholder="e.g. monthly fee, match food"><div class="actions"><button class="primary">Save ${type==='in'?'contribution':'expense'}</button><button type="button" onclick="setTab('${type==='in'?'monthly':'ledger'}')">Cancel</button></div></form>`);
}
function saveEntry(ev,type){ev.preventDefault();let f=new FormData(ev.target),amount=Number(f.get('amount'));if(!(amount>0))return;db.entries.push({id:crypto.randomUUID(),type,amount,date:f.get('date'),month:type==='in'?(f.get('month')||f.get('date').slice(0,7)):f.get('date').slice(0,7),playerId:f.get('playerId')||null,note:f.get('note').trim()});save();setTab(type==='in'?'monthly':'ledger')}
function exportCSV(){let rows=[['Type','Date','Month','Player','Amount','Note'],...db.entries.map(e=>[e.type,e.date,e.month,e.playerId?playerName(e.playerId):'',e.amount,e.note||''])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='yuva11-ledger.csv';a.click();URL.revokeObjectURL(a.href)}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='yuva11-backup.json';a.click();URL.revokeObjectURL(a.href)}
function restore(ev){let file=ev.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.entries))throw 0;if(confirm('Replace current app data with this backup?')){db=d;save();render();alert('Backup restored.')}}catch(e){alert('This backup file is not valid.')}};r.readAsText(file)}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
