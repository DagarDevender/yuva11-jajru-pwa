<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174238"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Yuva 11 Fund">
<link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Yuva 11 Jajru – Team Fund Manager</title>
<style>
:root{--g:#174238;--g2:#217b55;--gold:#e5b65b;--bg:#f1f5f2;--muted:#77877f;--red:#c94d4d;--line:#e0e9e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#20372f;font: .78rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:78px}
header{background:linear-gradient(135deg,#123b32,#245c4d);color:#fff;padding:34px 16px 19px;border-radius:0 0 18px 18px}.brand{font-size:1.22rem;font-weight:900;letter-spacing:.7px}.sub{color:var(--gold);font-weight:800;letter-spacing:3px;font-size:.62rem;margin-top:4px}
main{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:9px 0;box-shadow:0 4px 15px #173e3009}
.kicker{font-size:.64rem;letter-spacing:1.4px;color:var(--muted);font-weight:800;text-transform:uppercase}.big{font-size:1.85rem;font-weight:900;margin:7px 0}.green{color:var(--g2)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{font-size:1.28rem;font-weight:850;margin-top:6px}.section-title{font-size:1.08rem;font-weight:850;margin:3px 0 12px}
button,.btn{border:0;border-radius:11px;padding:10px 12px;font-size:.78rem;font-weight:750;background:#e8f0eb;color:var(--g);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.primary{background:var(--g);color:white}.danger{background:#fff0ef;color:var(--red)}.gold{background:#fff5df;color:#7b5819}.small{padding:7px 9px;font-size:.68rem;border-radius:9px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.item{padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.muted{color:var(--muted);font-size:.7rem;line-height:1.45}.amount{font-weight:850;font-size:.88rem}.empty{color:var(--muted);padding:16px 0;text-align:center}
input,select,textarea{width:100%;padding:10px;border:1px solid #d8e3dc;border-radius:10px;background:#fff;font:inherit;color:#20372f;margin:5px 0 10px}label{font-size:.72rem;font-weight:750;color:#52665c;display:block}form .actions{margin-top:5px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:5}nav button{background:transparent;padding:7px 3px;font-size:.66rem;color:var(--muted);flex:1;display:block;line-height:1.5}nav button.active{background:#e8f0eb;color:var(--g)}
.pill{font-size:.62rem;padding:4px 7px;border-radius:20px;background:#e7f4eb;color:#217b55;font-weight:800;white-space:nowrap}.pill.pending{background:#fff2df;color:#94651a}.pill.loan{background:#fff0ef;color:#b34b4b}
.clickcard{cursor:pointer;text-align:left;width:100%;display:block;color:inherit;background:white;border:1px solid var(--line);box-shadow:0 4px 15px #173e3009}.clickcard:active{transform:scale(.99)}.clickhint{font-size:.62rem;color:var(--muted);margin-top:5px}
.tablewrap{overflow-x:auto;width:100%;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:520px;font-size:.72rem}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#f5f8f6;color:#5c7066;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.right{text-align:right}
.playercard{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#fff}.statline{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.statbox{background:#f4f7f5;border-radius:9px;padding:7px 9px;flex:1;min-width:90px}.statbox b{display:block;font-size:.9rem;margin-top:3px}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}.back{margin-bottom:9px}
@media(min-width:650px){.grid.cards4{grid-template-columns:repeat(4,minmax(0,1fr))}.playergrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:18px}main{padding:18px}}
@media(max-width:360px){main{padding:8px}.card{padding:12px}.row{align-items:flex-start}.actions button{flex:1}}
</style></head><body>
<header><div class="brand">🏏 YUVA 11 JAJRU</div><div class="sub">TEAM FUND MANAGER</div></header><main id="app"></main>
<nav><button data-tab="home" class="active">⌂<br>Home</button><button data-tab="players">♙<br>Players</button><button data-tab="monthly">₹<br>Monthly</button><button data-tab="ledger">▤<br>Ledger</button><button data-tab="reports">▦<br>Reports</button></nav>
<script>
const KEY='yuva11_fund_v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{players:[],entries:[],opening:0};db.players??=[];db.entries??=[];let tab='home';
const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)),nowMonth=()=>new Date().toISOString().slice(0,7),dateNow=()=>new Date().toISOString().slice(0,10);
const sum=t=>db.entries.filter(e=>e.type===t).reduce((a,e)=>a+Number(e.amount),0),balance=()=>Number(db.opening||0)+sum('in')+sum('repay')-sum('out')-sum('loan');
const active=()=>db.players.filter(p=>!p.archived),pname=id=>db.players.find(p=>p.id===id)?.name||'Former player';
const ptotal=(id,m)=>db.entries.filter(e=>e.type==='in'&&e.playerId===id&&(!m||e.month===m)).reduce((a,e)=>a+Number(e.amount),0);
const loanTotal=id=>db.entries.filter(e=>e.playerId===id&&e.type==='loan').reduce((a,e)=>a+Number(e.amount),0),repaid=id=>db.entries.filter(e=>e.playerId===id&&e.type==='repay').reduce((a,e)=>a+Number(e.amount),0),owed=id=>loanTotal(id)-repaid(id);
function card(t,c){return `<section class="card">${t?`<div class="section-title">${t}</div>`:''}${c}</section>`}
function setTab(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){let o='',m=window.selMonth||nowMonth();
if(tab==='home'){
o=`<button class="clickcard card" onclick="showFund()"><div class="kicker">AVAILABLE TEAM FUND</div><div class="big">${money(balance())}</div><div class="muted">Opening balance + received + repayments − expenses − player advances</div><div class="clickhint">Tap to view full plus / minus statement →</div></button>
<div class="grid cards4">${metricCard('TOTAL RECEIVED',money(sum('in')+sum('repay')),'green',"showFund('in')")}${metricCard('TOTAL EXPENSES',money(sum('out')),'red',"showFund('out')")}${metricCard('PLAYERS',active().length+' / 20','',"setTab('players')")}${metricCard('PLAYER ADVANCES',money(sum('loan')-sum('repay')),'red',"showLoans()")}</div>
${card('Quick actions',`<div class="actions"><button class="primary" onclick="showEntry('in')">＋ Contribution</button><button onclick="setTab('players')">Players</button><button onclick="setTab('monthly')">Monthly</button><button class="gold" onclick="showEntry('out')">− Expense</button></div>`)}
${card('Recent transactions',entryTable(db.entries.slice().sort(sortDate).slice(0,5)))}`;
}else if(tab==='players'){
o=card('Team players',`<div class="row"><span class="muted">${active().length} active players · Maximum 20</span><button class="primary small" onclick="playerForm()">＋ Add player</button></div><div class="playergrid">${active().map(p=>{let a=ptotal(p.id,nowMonth()),l=owed(p.id);return `<div class="playercard"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.phone||'Phone not added')}</div></div><span class="pill ${a?'':'pending'}">${a?'Monthly paid':'Payment pending'}</span></div><div class="statline"><div class="statbox"><span class="muted">This month</span><b class="green">${money(a)}</b></div><div class="statbox"><span class="muted">Borrowed from fund</span><b class="${l>0?'red':''}">${money(l)}</b></div></div><div class="muted">${a?'Contribution received this month.':'No contribution recorded for this month yet.'} ${l>0?'Outstanding team advance is '+money(l)+'.':'No outstanding team advance.'}</div><hr><div class="actions"><button class="small" onclick="playerForm('${p.id}')">Edit</button><button class="small" onclick="showEntry('in','${p.id}')">＋ Receive</button><button class="small gold" onclick="showEntry('loan','${p.id}')">Give advance</button><button class="small" onclick="showPlayerHistory('${p.id}')">History</button><button class="small danger" onclick="removePlayer('${p.id}')">Delete</button></div></div>`}).join('')||'<div class="empty">No players added yet.</div>'}</div>`);
}else if(tab==='monthly'){
let ins=db.entries.filter(e=>e.type==='in'&&e.month===m).reduce((a,e)=>a+ +e.amount,0),count=active().filter(p=>ptotal(p.id,m)>0).length;
o=card('Monthly contribution dashboard',`<div class="row"><div><div class="kicker">Choose contribution month</div><input type="month" value="${m}" onchange="window.selMonth=this.value;render()"></div><button class="small primary" onclick="showEntry('in','','${m}')">＋ Add received</button></div><div class="grid"><div class="statbox"><span class="muted">Total received</span><b class="green">${money(ins)}</b></div><div class="statbox"><span class="muted">Paid players</span><b>${count} / ${active().length}</b></div></div><div class="playergrid" style="margin-top:10px">${active().map(p=>{let a=ptotal(p.id,m);return `<div class="playercard"><div class="row"><b>${esc(p.name)}</b><span class="pill ${a?'':'pending'}">${a?'Paid':'Pending'}</span></div><div class="big ${a?'green':''}" style="font-size:1.35rem">${money(a)}</div><div class="muted">${a?'Amount received in '+m:'No payment recorded for '+m}</div><button class="primary small" style="margin-top:9px;width:100%" onclick="showEntry('in','${p.id}','${m}')">＋ Record payment</button></div>`}).join('')||'<div class="empty">Add players to start monthly tracking.</div>'}</div><p class="muted">Paid means at least one contribution is recorded for the selected month. No fixed monthly fee is assumed.</p>`);
}else if(tab==='ledger'){o=card('Team ledger',`<div class="actions"><button class="primary" onclick="showEntry('in')">＋ Contribution</button><button class="gold" onclick="showEntry('out')">− Expense</button><button onclick="showEntry('loan')">Give player advance</button><button onclick="showEntry('repay')">Record repayment</button></div>${entryTable(db.entries.slice().sort(sortDate))}`)}
else if(tab==='reports'){let inc=db.entries.filter(e=>['in','repay'].includes(e.type)&&e.date.slice(0,7)===m).reduce((a,e)=>a+ +e.amount,0),out=db.entries.filter(e=>['out','loan'].includes(e.type)&&e.date.slice(0,7)===m).reduce((a,e)=>a+ +e.amount,0);
o=card('Reports & exports',`<label>Report month</label><input type="month" value="${m}" onchange="window.selMonth=this.value;render()"><div class="grid"><div class="statbox"><span class="muted">Money in</span><b class="green">${money(inc)}</b></div><div class="statbox"><span class="muted">Money out</span><b class="red">${money(out)}</b></div></div><div class="big">${money(inc-out)}</div><div class="muted">Net movement for ${m}</div><hr><div class="actions"><button class="primary" onclick="exportCSV('all')">Download full ledger CSV</button><button onclick="exportCSV('month')">Download this month CSV</button><button onclick="exportPlayerCSV()">Player-wise CSV</button><button onclick="backup()">Backup all data (JSON)</button><label class="btn">Restore backup<input type="file" accept="application/json" onchange="restore(event)" hidden></label></div><p class="muted">CSV files open in Excel or Apple Numbers. JSON backup preserves all app records.</p>`);
}
$('#app').innerHTML=o}
function metricCard(t,v,c,fn){return `<button class="clickcard card" onclick="${fn}"><div class="kicker">${t}</div><div class="metric ${c}">${v}</div><div class="clickhint">Tap to view details →</div></button>`}
function sortDate(a,b){return (b.date||'').localeCompare(a.date||'')}
function labelType(t){return ({in:'Contribution received',out:'Team expense',loan:'Player advance given',repay:'Player advance repaid'})[t]||t}
function entryTable(items){if(!items.length)return '<div class="empty">No transactions recorded yet.</div>';return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Type / details</th><th>Player</th><th class="right">Amount</th></tr></thead><tbody>${items.map(e=>`<tr><td>${esc(e.date)}</td><td>${labelType(e.type)}${e.note?' · '+esc(e.note):''}</td><td>${e.playerId?esc(pname(e.playerId)):'—'}</td><td class="right ${['in','repay'].includes(e.type)?'green':'red'}">${['in','repay'].includes(e.type)?'+':'−'}${money(e.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function showFund(filter=''){let items=db.entries.slice().sort(sortDate).filter(e=>!filter||(filter==='in'?['in','repay'].includes(e.type):['out','loan'].includes(e.type)));let rows=[['Opening balance','',Number(db.opening||0),'Opening balance']];items.forEach(e=>rows.push([e.date,labelType(e.type)+(e.note?' - '+e.note:''),(['in','repay'].includes(e.type)?1:-1)*Number(e.amount),e.playerId?pname(e.playerId):'']));let run=Number(db.opening||0);let table=items.map(e=>{run+=(['in','repay'].includes(e.type)?1:-1)*Number(e.amount);return `<tr><td>${esc(e.date)}</td><td>${labelType(e.type)}${e.note?' · '+esc(e.note):''}</td><td>${e.playerId?esc(pname(e.playerId)):'—'}</td><td class="right ${['in','repay'].includes(e.type)?'green':'red'}">${['in','repay'].includes(e.type)?'+':'−'}${money(e.amount)}</td><td class="right">${money(run)}</td></tr>`}).join('');
$('#app').innerHTML=card('Team fund statement',`<button class="small back" onclick="setTab('home')">← Back to Home</button><div class="big">${money(balance())}</div><div class="grid"><div class="statbox"><span class="muted">Total received incl. repayments</span><b class="green">${money(sum('in')+sum('repay'))}</b></div><div class="statbox"><span class="muted">Total paid out</span><b class="red">${money(sum('out')+sum('loan'))}</b></div></div><hr><div class="actions"><button class="small" onclick="showFund('in')">＋ Money in</button><button class="small" onclick="showFund('out')">− Money out</button><button class="small" onclick="showFund()">All transactions</button><button class="small primary" onclick="exportCSV('all')">Download CSV / Excel</button></div><div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Transaction</th><th>Player</th><th class="right">Plus / Minus</th><th class="right">Balance</th></tr></thead><tbody><tr><td>—</td><td>Opening balance</td><td>—</td><td class="right">${money(db.opening)}</td><td class="right">${money(db.opening)}</td></tr>${table}</tbody></table></div>`)}
function showLoans(){let ps=db.players.filter(p=>loanTotal(p.id)>0);$('#app').innerHTML=card('Player advances / borrowed amount',`<button class="small back" onclick="setTab('home')">← Back to Home</button>${ps.map(p=>`<div class="item row"><div><b>${esc(p.name)}</b><div class="muted">Given ${money(loanTotal(p.id))} · Repaid ${money(repaid(p.id))}</div></div><b class="red">${money(owed(p.id))}</b></div>`).join('')||'<div class="empty">No player advances recorded.</div>'}<button class="primary" onclick="setTab('players')">Manage player advances</button>`)}
function playerForm(id){let p=db.players.find(x=>x.id===id)||{name:'',phone:''};$('#app').innerHTML=card(id?'Edit player':'Add new player',`<form onsubmit="savePlayer(event,'${id||''}')"><label>Player name *</label><input name="name" required maxlength="50" value="${esc(p.name)}" placeholder="Enter player name"><label>Phone (optional)</label><input name="phone" value="${esc(p.phone||'')}" placeholder="Phone number"><div class="actions"><button class="primary">Save player</button><button type="button" onclick="setTab('players')">Cancel</button></div></form>`)}
function savePlayer(ev,id){ev.preventDefault();let f=new FormData(ev.target),name=f.get('name').trim();if(!name)return;if(id){let p=db.players.find(x=>x.id===id);p.name=name;p.phone=f.get('phone').trim()}else{if(active().length>=20){alert('Maximum 20 active players.');return}db.players.push({id:crypto.randomUUID(),name,phone:f.get('phone').trim(),archived:false})}save();setTab('players')}
function removePlayer(id){if(!confirm('Remove this player from the active list? Their old transactions and advance balance will be retained.'))return;db.players.find(p=>p.id===id).archived=true;save();render()}
function showPlayerHistory(id){let p=db.players.find(x=>x.id===id);$('#app').innerHTML=card(esc(p.name)+' · Account history',`<button class="small back" onclick="setTab('players')">← Back to Players</button><div class="grid"><div class="statbox"><span class="muted">Contributions</span><b class="green">${money(ptotal(id))}</b></div><div class="statbox"><span class="muted">Outstanding advance</span><b class="red">${money(owed(id))}</b></div></div>${entryTable(db.entries.filter(e=>e.playerId===id).sort(sortDate))}<div class="actions"><button class="primary" onclick="showEntry('in','${id}')">＋ Contribution</button><button class="gold" onclick="showEntry('loan','${id}')">Give advance</button><button onclick="showEntry('repay','${id}')">Record repayment</button></div>`)}
function showEntry(type,playerId='',month=''){let date=dateNow(),players=active(),titles={in:'Record contribution received',out:'Record team expense',loan:'Give money to a player (advance)',repay:'Record player repayment'};
$('#app').innerHTML=card(titles[type],`<form onsubmit="saveEntry(event,'${type}')">${['in','loan','repay'].includes(type)?`<label>Player *</label><select name="playerId" required><option value="">Select player</option>${players.map(p=>`<option value="${p.id}" ${p.id===playerId?'selected':''}>${esc(p.name)}${type==='repay'?' · Outstanding '+money(owed(p.id)):''}</option>`).join('')}</select>`:''}<label>Amount (₹) *</label><input name="amount" type="number" min="1" step="0.01" required placeholder="Enter amount">${type==='repay'?'<div class="muted">Repayment increases team balance and reduces the player’s outstanding advance.</div>':''}<label>Date *</label><input name="date" type="date" required value="${date}">${type==='in'?`<label>Contribution month</label><input name="month" type="month" value="${month||date.slice(0,7)}">`:''}<label>Note (optional)</label><input name="note" maxlength="100" placeholder="${type==='loan'?'e.g. Temporary advance':type==='out'?'e.g. Match expenses':'Add a note'}"><div class="actions"><button class="primary">Save transaction</button><button type="button" onclick="setTab('${type==='in'?'monthly':type==='out'?'ledger':'players'}')">Cancel</button></div></form>`)}
function saveEntry(ev,type){ev.preventDefault();let f=new FormData(ev.target),amount=Number(f.get('amount')),pid=f.get('playerId');if(!(amount>0))return;if(['in','loan','repay'].includes(type)&&!pid)return;if(type==='repay'&&amount>owed(pid)){if(!confirm('This repayment is greater than the recorded outstanding advance. Continue?'))return}
db.entries.push({id:crypto.randomUUID(),type,amount,date:f.get('date'),month:type==='in'?(f.get('month')||f.get('date').slice(0,7)):f.get('date').slice(0,7),playerId:pid||null,note:f.get('note').trim()});save();setTab(type==='in'?'monthly':type==='out'?'ledger':'players')}
function exportCSV(scope){let entries=db.entries.filter(e=>scope!=='month'||e.date.slice(0,7)===(window.selMonth||nowMonth()));let rows=[['Date','Type','Month','Player','Amount','Money direction','Note'],...entries.map(e=>[e.date,labelType(e.type),e.month||'',e.playerId?pname(e.playerId):'',e.amount,['in','repay'].includes(e.type)?'Plus':'Minus',e.note||''])];downloadCSV('yuva11-ledger'+(scope==='month'?'-'+(window.selMonth||nowMonth()):'')+'.csv',rows)}
function exportPlayerCSV(){let rows=[['Player','Contributions','Advances received','Repaid','Outstanding advance'],...db.players.map(p=>[p.name,ptotal(p.id),loanTotal(p.id),repaid(p.id),owed(p.id)])];downloadCSV('yuva11-player-summary.csv',rows)}
function downloadCSV(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=url;a.download='yuva11-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.players)||!Array.isArray(d.entries))throw 0;if(confirm('Replace current app data with this backup?')){db=d;save();render();alert('Backup restored.')}}catch(e){alert('Invalid backup file.')}};r.readAsText(f)}
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
